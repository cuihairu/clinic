<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>候诊区展示屏 · 广告轮播</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 1920px; height: 1080px; overflow: hidden; background: #22312a; position: relative; }
  .slide { position: absolute; inset: 56px; border-radius: 24px; overflow: hidden;
    background: linear-gradient(160deg, #f8f9f7 0%, #eef2ee 58%, #e6ede8 100%);
    display: flex; }
  /* 左侧文案 */
  .copy { flex: 1; padding: 110px 90px; display: flex; flex-direction: column; }
  .eyebrow { display: inline-flex; align-self: flex-start; font-size: 22px; letter-spacing: 6px;
    color: var(--amber-deep); border: 1.5px solid #ddc9a4; border-radius: 999px; padding: 10px 28px; }
  h1 { font-family: var(--serif); font-size: 110px; line-height: 1.22; letter-spacing: 4px; margin-top: 52px;
    color: var(--ink); }
  h1 em { font-style: normal; color: var(--brand); }
  .sub { font-size: 30px; color: var(--muted); margin-top: 40px; line-height: 1.7; }
  .offer { margin-top: auto; display: flex; align-items: center; gap: 26px; }
  .price { font-family: var(--serif); font-size: 84px; font-weight: 700; color: var(--brand-deep); }
  .price small { font-size: 34px; }
  .offer .cond { font-size: 24px; color: var(--muted); line-height: 1.7; }
  /* 右侧大字视觉 */
  .visual { width: 560px; background: linear-gradient(170deg, var(--brand-deep), var(--brand));
    display: grid; place-items: center; position: relative; }
  .visual .zi { font-family: var(--serif); font-size: 300px; color: rgba(255,255,255,0.94); font-weight: 700; }
  .visual .ring { position: absolute; width: 430px; height: 430px; border: 2px solid rgba(255,255,255,0.28);
    border-radius: 50%; }
  .visual .ring.r2 { width: 330px; height: 330px; border-color: rgba(255,255,255,0.16); }
  /* 叫号条 */
  .call { position: absolute; left: 56px; right: 56px; bottom: 56px; height: 96px;
    background: rgba(34, 49, 42, 0.92); border-radius: 18px; backdrop-filter: blur(8px);
    display: flex; align-items: center; padding: 0 34px; gap: 20px; color: #fff; }
  .call .label { font-size: 24px; background: var(--amber); color: #fff; border-radius: 10px; padding: 10px 20px; }
  .call .who { font-size: 30px; font-weight: 600; letter-spacing: 2px; }
  .call .room { font-size: 30px; color: #d8e4dc; margin-left: auto; }
  .call .room b { color: #fff; font-family: var(--serif); font-size: 38px; margin: 0 6px; }
  /* 轮播进度 */
  .pager { position: absolute; top: 84px; right: 96px; display: flex; gap: 9px; }
  .pager i { width: 10px; height: 10px; border-radius: 999px; background: #cfd9d2; }
  .pager i.on { width: 28px; background: var(--brand); }
</style>
</head>
<body>
  <div class="slide">
    <div class="copy">
      <span class="eyebrow">冬病夏治</span>
      <h1>三伏艾灸，<br>借阳<em>祛寒</em>正当时</h1>
      <p class="sub">督脉灸配伍中脘、足三里，<br>适合手脚怕冷、脾胃虚寒的顾客。</p>
      <div class="offer">
        <div class="price">¥880<small> / 10 次</small></div>
        <div class="cond">三伏灸疗程卡<br>购卡即赠腹部推拿一次</div>
      </div>
    </div>
    <div class="visual">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="zi">灸</div>
    </div>
  </div>
  <div class="pager"><i class="on"></i><i></i><i></i></div>
  <div class="call">
    <span class="label">请就诊</span>
    <span class="who">08 号 王女士</span>
    <span class="room">到<b>3</b>号诊室</span>
  </div>
</body>
</html>
