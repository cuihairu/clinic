<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小程序 · 首页</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 390px; height: 844px; overflow: hidden; background: var(--paper); position: relative; }
  /* 状态栏 */
  .statusbar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px;
    font-size: 14px; font-weight: 600; }
  /* 品牌头 */
  .brand-head { padding: 10px 20px 16px; display: flex; align-items: center; gap: 12px; }
  .seal { width: 46px; height: 46px; border-radius: 12px; background: var(--amber); color: #fff;
    font-family: var(--serif); font-size: 24px; font-weight: 700; display: grid; place-items: center;
    box-shadow: 0 3px 10px rgba(184, 147, 90, 0.35); }
  .brand-head .bt { flex: 1; }
  .brand-head .bn { font-family: var(--serif); font-size: 19px; font-weight: 700; }
  .brand-head .bg { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .bell { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; background: var(--card);
    display: grid; place-items: center; color: var(--muted); font-size: 16px; }
  /* 预约横幅 */
  .appt { margin: 0 16px; background: linear-gradient(120deg, var(--brand-deep), var(--brand));
    border-radius: 14px; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .appt .ic { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.16);
    display: grid; place-items: center; font-family: var(--serif); font-size: 18px; }
  .appt .tt { font-size: 14.5px; font-weight: 600; }
  .appt .ss { font-size: 12px; opacity: 0.82; margin-top: 3px; }
  .appt .go { font-size: 12px; background: rgba(255,255,255,0.18); padding: 6px 12px; border-radius: 999px; }
  /* 区块标题 */
  .sec { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 20px 10px; }
  .sec h3 { font-family: var(--serif); font-size: 17px; }
  .sec a { font-size: 12px; color: var(--faint); text-decoration: none; }
  /* 项目卡 */
  .items { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .item .cover { height: 92px; display: grid; place-items: center; font-family: var(--serif); font-size: 26px; }
  .item .cover.g1 { background: linear-gradient(135deg, #e9ebe9, #ced4d1); color: var(--brand-deep); }
  .item .cover.g2 { background: linear-gradient(135deg, #efe6d4, #e0cba6); color: var(--amber-deep); }
  .item .bd { padding: 11px 13px 13px; }
  .item .nm { font-size: 14.5px; font-weight: 600; }
  .item .ds { font-size: 11.5px; color: var(--faint); margin-top: 3px; }
  .item .pr { margin-top: 8px; font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--brand-deep); }
  .item .pr small { font-size: 11px; color: var(--faint); font-family: var(--sans); font-weight: 400; }
  /* 我的卡项横滑 */
  .cards { display: flex; gap: 10px; padding: 0 16px; overflow: hidden; }
  .mycard { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 13px 14px; }
  .mycard .cn { font-size: 13px; font-weight: 600; }
  .mycard .cv { font-family: var(--serif); font-size: 21px; font-weight: 700; color: var(--amber-deep); margin-top: 7px; }
  .mycard .cv small { font-size: 11px; color: var(--faint); font-family: var(--sans); font-weight: 400; }
  .mycard .cl { height: 5px; border-radius: 999px; background: var(--paper); margin-top: 9px; }
  .mycard .cl i { display: block; height: 100%; width: 60%; border-radius: 999px; background: var(--amber); }
  /* 底部 tabbar */
  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 82px; background: var(--card);
    border-top: 1px solid var(--line); display: flex; padding: 9px 8px 0; }
  .tab { flex: 1; text-align: center; font-size: 10.5px; color: var(--faint); }
  .tab .ti { width: 13px; height: 13px; border: 2px solid #9aa49d; border-radius: 50%; margin: 5px auto 10px; }
  .tab.on { color: var(--brand-deep); font-weight: 600; }
  .tab.on .ti { border-color: var(--brand); background: var(--brand); }
  .homebar { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 999px; background: #d5dad6; }
</style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span>●●●</span></div>
  <div class="brand-head">
    <div class="seal">养</div>
    <div class="bt">
      <div class="bn">Youngs 中医养生</div>
      <div class="bg">下午好，王女士</div>
    </div>
    <div class="bell">王</div>
  </div>
  <div class="appt">
    <div class="ic">灸</div>
    <div style="flex:1">
      <div class="tt">明日 10:00 · 艾灸调理</div>
      <div class="ss">已预约，到店报手机号即可</div>
    </div>
    <span class="go">详情</span>
  </div>
  <div class="sec"><h3>今日宜养</h3><a>全部项目</a></div>
  <div class="items">
    <div class="item">
      <div class="cover g1">灸</div>
      <div class="bd">
        <div class="nm">艾灸调理</div>
        <div class="ds">温经散寒 · 40 分钟</div>
        <div class="pr">¥100 <small>/ 次</small></div>
      </div>
    </div>
    <div class="item">
      <div class="cover g2">推</div>
      <div class="bd">
        <div class="nm">腹部推拿</div>
        <div class="ds">健脾和胃 · 30 分钟</div>
        <div class="pr">¥180 <small>/ 次</small></div>
      </div>
    </div>
  </div>
  <div class="sec"><h3>我的卡项</h3><a>全部 2 张</a></div>
  <div class="cards">
    <div class="mycard">
      <div class="cn">10 次艾灸卡</div>
      <div class="cv">6 <small>次剩余</small></div>
      <div class="cl"><i></i></div>
    </div>
    <div class="mycard">
      <div class="cn">肩颈放松卡</div>
      <div class="cv">2 <small>次剩余</small></div>
      <div class="cl"><i style="width:40%; background: var(--brand);"></i></div>
    </div>
  </div>
  <div class="sec"><h3>养生贴士</h3></div>
  <div style="margin:0 16px; background:#f0f1ee; border-radius:13px; padding:14px 16px; font-size:12.5px; color:#4b4f4d; line-height:1.7">
    <b style="font-family:var(--serif); font-size:13.5px; color:var(--brand-deep)">秋燥宜润肺</b><br>
    少辛增酸，早卧早起；艾灸后两小时勿碰冷水。
  </div>
  <div class="tabbar">
    <div class="tab on"><div class="ti"></div>首页</div>
    <div class="tab"><div class="ti"></div>预约</div>
    <div class="tab"><div class="ti"></div>卡项</div>
    <div class="tab"><div class="ti"></div>我的</div>
  </div>
  <div class="homebar"></div>
</body>
</html>
