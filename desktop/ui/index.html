<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinomed 工作站 · 首次配置</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #f6f5f1; color: #17211b;
        font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .card {
        width: min(520px, 92vw); background: #fff; border-radius: 16px;
        box-shadow: 0 4px 24px rgba(20, 24, 22, 0.12); padding: 32px;
      }
      h1 { font-size: 22px; margin: 0 0 6px; }
      .sub { font-size: 14px; color: #6b7a71; margin-bottom: 22px; }
      label { display: block; font-size: 14px; color: #6b7a71; margin-bottom: 6px; }
      input {
        width: 100%; font-size: 16px; padding: 11px 12px; border: 2px solid #cfd8d2;
        border-radius: 10px; background: #fbfbf9; color: #17211b; font-family: inherit;
      }
      input:focus { outline: none; border-color: #2f6d4f; }
      button {
        width: 100%; margin-top: 18px; font-size: 16px; font-weight: 600; padding: 12px 0;
        border: none; border-radius: 10px; background: #2f6d4f; color: #fff;
        cursor: pointer; font-family: inherit;
      }
      button:disabled { opacity: 0.6; }
      .status { margin-top: 14px; font-size: 14px; min-height: 1.4em; }
      .status.err { color: #b3402f; }
      .status.ok { color: #2f6d4f; }
      .diag { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e7ebe8; font-size: 12px; color: #6b7a71; line-height: 1.7; }
      .print-row { display: flex; gap: 10px; margin-top: 16px; }
      .print-row button { margin-top: 0; font-size: 14px; padding: 10px 0; background: #eef1ee; color: #17211b; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>首次配置</h1>
      <div class="sub">填写管理端 web 地址，本工作站将直接加载该页面（业务与浏览器版一致）。</div>
      <label for="serverUrl">管理端地址（http:// 或 https:// 完整地址）</label>
      <input id="serverUrl" type="url" placeholder="如 http://192.168.1.10/" autocomplete="off" />
      <button id="saveBtn" type="button">保存并打开</button>
      <div id="status" class="status"></div>
      <div class="print-row">
        <button id="printPrescription" type="button">打印自检 · A5 处方笺</button>
        <button id="printReceipt" type="button">打印自检 · 80mm 小票</button>
      </div>
      <div id="printStatus" class="status"></div>
      <div id="diag" class="diag"></div>
    </div>
    <script>
      const input = document.getElementById('serverUrl')
      const btn = document.getElementById('saveBtn')
      const status = document.getElementById('status')
      const diag = document.getElementById('diag')
      const invoke = window.__TAURI__.core.invoke

      function show(text, cls) {
        status.textContent = text
        status.className = 'status' + (cls ? ' ' + cls : '')
      }

      btn.addEventListener('click', async () => {
        const cfg = await invoke('get_config')
        cfg.server_url = input.value.trim()
        btn.disabled = true
        try {
          await invoke('set_config', { config: cfg })
          show('已保存，正在打开…', 'ok')
          window.location.replace(cfg.server_url)
        } catch (e) {
          show(String(e), 'err')
        } finally {
          btn.disabled = false
        }
      })

      // 打印自检：用样张数据走完整渲染 + 隐藏窗口 + 系统打印对话框链路（desktop.md D2）
      const printStatus = document.getElementById('printStatus')
      const sampleData = {
        prescription: {
          clinicName: '示例医馆（样张）',
          patient: '张三',
          gender: '女',
          age: '38',
          phone: '138****0000',
          date: new Date().toLocaleDateString('zh-CN'),
          diagnosis: '脾胃虚寒，宜温中健脾',
          doctor: '李医师',
          items: [
            { name: '艾灸调理', usage: '隔日一次，每次 40 分钟', qty: '3 次' },
            { name: '腹部推拿', usage: '每日一次，每次 30 分钟', qty: '5 次' }
          ]
        },
        receipt: {
          clinicName: '示例医馆（样张）',
          orderNo: '12',
          customerName: '测试客人',
          date: new Date().toLocaleString('zh-CN', { hour12: false }),
          items: [
            { name: '艾灸调理', qty: '1', amount: '¥100' },
            { name: '腹部推拿', qty: '2', amount: '¥360' }
          ],
          total: '¥460',
          staff: '前台'
        }
      }
      async function printSample(name) {
        printStatus.textContent = '正在调起打印…'
        printStatus.className = 'status'
        try {
          const path = await invoke('print_html', { template: name, data: sampleData[name] })
          printStatus.textContent = '已调起系统打印对话框（临时文件 ' + path.split('/').pop() + '）'
          printStatus.className = 'status ok'
        } catch (e) {
          printStatus.textContent = String(e)
          printStatus.className = 'status err'
        }
      }
      document.getElementById('printPrescription').addEventListener('click', () => printSample('prescription'))
      document.getElementById('printReceipt').addEventListener('click', () => printSample('receipt'))

      ;(async () => {
        try {
          const cfg = await invoke('get_config')
          if (cfg.server_url) {
            input.value = cfg.server_url
            show('已配置地址。正常启动时主窗口会直接打开该地址；本页仅在网络不可达等情况下手动打开。', 'ok')
          }
          const version = await window.__TAURI__.app.getVersion()
          diag.textContent = `版本 ${version} · 更新通道 ${cfg.update_channel} · 窗口 ${cfg.window_width}×${cfg.window_height}`
        } catch (e) {
          diag.textContent = '诊断信息不可用：' + String(e)
        }
      })()
    </script>
  </body>
</html>
