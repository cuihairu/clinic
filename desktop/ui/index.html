<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinomed 工作站 · 首次配置</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* 引导页对齐 tokens（desktop.md / alignment P1-12）：石墨基调、宣纸底、宋体标题、
         金棕点缀；外设自检状态行统一圆点 pill。语义错误色 #b3402f 保留。 */
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--paper); color: var(--ink);
        font-family: var(--sans);
      }
      .card {
        width: min(520px, 92vw); background: var(--card); border-radius: 16px;
        border: 1px solid var(--line);
        box-shadow: 0 4px 24px rgba(38, 41, 39, 0.1); padding: 32px;
      }
      h1 { font-family: var(--serif); font-size: 22px; margin: 0 0 6px; color: var(--ink); letter-spacing: 1px; }
      .sub { font-size: 14px; color: var(--muted); margin-bottom: 22px; }
      h3.sec-title { font-family: var(--serif); font-size: 15px; color: var(--ink); margin: 24px 0 4px; }
      label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
      input {
        width: 100%; font-size: 16px; padding: 11px 12px; border: 2px solid var(--line);
        border-radius: 10px; background: var(--paper); color: var(--ink); font-family: inherit;
      }
      input:focus { outline: none; border-color: var(--brand); }
      label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); margin: 14px 0 2px; cursor: pointer; }
      label.check input { width: 16px; height: 16px; padding: 0; accent-color: var(--brand); }
      button {
        width: 100%; margin-top: 18px; font-size: 16px; font-weight: 600; padding: 12px 0;
        border: none; border-radius: 10px; background: var(--brand); color: #fff;
        cursor: pointer; font-family: inherit;
      }
      button:disabled { opacity: 0.6; }
      button.ghost { background: var(--brand-tint); color: var(--brand-deep); }
      .status {
        margin-top: 12px; font-size: 14px; min-height: 1.4em; color: var(--muted);
        display: flex; align-items: center; gap: 8px;
      }
      /* 外设/保存状态行统一圆点：中性待机、ok 墨绿(brand)、err 错误红 */
      .status::before {
        content: ''; width: 7px; height: 7px; border-radius: 50%;
        background: var(--faint); flex-shrink: 0;
      }
      .status.ok::before { background: var(--brand); }
      .status.err::before { background: #b3402f; }
      .status.err { color: #b3402f; }
      .status.ok { color: var(--brand-deep); }
      .diag { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.7; }
      .print-row { display: flex; gap: 10px; margin-top: 10px; }
      .print-row input { flex: 1; font-size: 14px; padding: 9px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); min-width: 0; }
      .print-row input:focus { outline: none; border-color: var(--brand); }
      .print-row button { width: auto; margin-top: 0; font-size: 14px; padding: 10px 14px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>首次配置</h1>
      <div class="sub">填写管理端 web 地址，本工作站将直接加载该页面（业务与浏览器版一致）。</div>
      <label for="serverUrl">管理端地址（http:// 或 https:// 完整地址）</label>
      <input id="serverUrl" type="url" placeholder="如 http://192.168.1.10/" autocomplete="off" />
      <label class="check"><input id="autostart" type="checkbox" /> 开机自动启动工作站（无人值守运行）</label>
      <button id="saveBtn" type="button">保存并打开</button>
      <div id="status" class="status"></div>
      <h3 class="sec-title">打印自检</h3>
      <div class="print-row">
        <button id="printPrescription" class="ghost" type="button">A5 处方笺</button>
        <button id="printReceipt" class="ghost" type="button">80mm 小票</button>
      </div>
      <h3 class="sec-title">外设自检</h3>
      <div class="print-row">
        <input id="escposPort" placeholder="小票机串口（如 /dev/ttyUSB0 或 COM3）" autocomplete="off" />
        <button id="printEscpos" class="ghost" type="button">ESC/POS 直连</button>
      </div>
      <div class="print-row">
        <input id="scannerPort" placeholder="扫码枪串口（HID 仿真不可用时的兜底，D9）" autocomplete="off" />
        <button id="scannerTest" class="ghost" type="button">监听测试</button>
      </div>
      <div id="printStatus" class="status"></div>
      <div id="diag" class="diag"></div>
    </div>
    <script>
      const input = document.getElementById('serverUrl')
      const btn = document.getElementById('saveBtn')
      const status = document.getElementById('status')
      const diag = document.getElementById('diag')
      const invoke = window.__TAURI__.core.invoke

      function show(text, cls) {
        status.textContent = text
        status.className = 'status' + (cls ? ' ' + cls : '')
      }

      btn.addEventListener('click', async () => {
        const cfg = await invoke('get_config')
        cfg.server_url = input.value.trim()
        btn.disabled = true
        try {
          await invoke('set_config', { config: cfg })
          show('已保存，正在打开…', 'ok')
          window.location.replace(cfg.server_url)
        } catch (e) {
          show(String(e), 'err')
        } finally {
          btn.disabled = false
        }
      })

      // 打印自检：用样张数据走完整渲染 + 隐藏窗口 + 系统打印对话框链路（desktop.md D2）
      const printStatus = document.getElementById('printStatus')
      const sampleData = {
        prescription: {
          clinicName: '示例医馆（样张）',
          patient: '张三',
          gender: '女',
          age: '38',
          phone: '138****0000',
          date: new Date().toLocaleDateString('zh-CN'),
          diagnosis: '脾胃虚寒，宜温中健脾',
          doctor: '李医师',
          items: [
            { name: '艾灸调理', usage: '隔日一次，每次 40 分钟', qty: '3 次' },
            { name: '腹部推拿', usage: '每日一次，每次 30 分钟', qty: '5 次' }
          ]
        },
        receipt: {
          clinicName: '示例医馆（样张）',
          orderNo: '12',
          customerName: '测试客人',
          date: new Date().toLocaleString('zh-CN', { hour12: false }),
          items: [
            { name: '艾灸调理', qty: '1', amount: '¥100' },
            { name: '腹部推拿', qty: '2', amount: '¥360' }
          ],
          total: '¥460',
          staff: '前台'
        }
      }
      async function printSample(name) {
        printStatus.textContent = '正在调起打印…'
        printStatus.className = 'status'
        try {
          const path = await invoke('print_html', { template: name, data: sampleData[name] })
          printStatus.textContent = '已调起系统打印对话框（临时文件 ' + path.split('/').pop() + '）'
          printStatus.className = 'status ok'
        } catch (e) {
          printStatus.textContent = String(e)
          printStatus.className = 'status err'
        }
      }
      document.getElementById('printPrescription').addEventListener('click', () => printSample('prescription'))
      document.getElementById('printReceipt').addEventListener('click', () => printSample('receipt'))

      // ESC/POS 直连自检（desktop.md D8）：小票样张数据编码后直写串口，免驱免打印对话框
      document.getElementById('printEscpos').addEventListener('click', async () => {
        const port = document.getElementById('escposPort').value.trim()
        if (!port) {
          printStatus.textContent = '先填小票机串口地址'
          printStatus.className = 'status err'
          return
        }
        printStatus.textContent = '正在写串口…'
        printStatus.className = 'status'
        try {
          const size = await invoke('print_escpos', { port, data: sampleData.receipt })
          printStatus.textContent = `已向 ${port} 写出 ${size} 字节 ESC/POS 小票`
          printStatus.className = 'status ok'
        } catch (e) {
          printStatus.textContent = String(e)
          printStatus.className = 'status err'
        }
      })

      // 串口扫码枪监听测试（desktop.md D9）：起监听后收到码值就地回显，收码事件由壳读线程推送
      document.getElementById('scannerTest').addEventListener('click', async () => {
        const port = document.getElementById('scannerPort').value.trim()
        if (!port) {
          printStatus.textContent = '先填扫码枪串口地址'
          printStatus.className = 'status err'
          return
        }
        try {
          await invoke('scanner_start', { port })
          printStatus.textContent = `正在监听 ${port}，请扫码（收到的码会显示在这里）`
          printStatus.className = 'status ok'
        } catch (e) {
          printStatus.textContent = String(e)
          printStatus.className = 'status err'
        }
      })
      window.__TAURI__.event.listen('scanner-code', ({ payload }) => {
        printStatus.textContent = `收到扫码：${payload}`
        printStatus.className = 'status ok'
      })
      window.__TAURI__.event.listen('scanner-error', ({ payload }) => {
        printStatus.textContent = String(payload)
        printStatus.className = 'status err'
      })

      // 开机自启开关：即点即生效（写 config.json + 收敛系统自启项），不依赖「保存并打开」
      const autostart = document.getElementById('autostart')
      autostart.addEventListener('change', async () => {
        try {
          await invoke('set_autostart', { enabled: autostart.checked })
          show(autostart.checked ? '已开启开机自启' : '已关闭开机自启', 'ok')
        } catch (e) {
          autostart.checked = !autostart.checked
          show('开机自启设置失败：' + String(e), 'err')
        }
      })

      ;(async () => {
        try {
          const cfg = await invoke('get_config')
          if (cfg.server_url) {
            input.value = cfg.server_url
            show('已配置地址。正常启动时主窗口会直接打开该地址；本页仅在网络不可达等情况下手动打开。', 'ok')
          }
          autostart.checked = !!cfg.autostart
          const version = await window.__TAURI__.app.getVersion()
          diag.textContent = `版本 ${version} · 更新通道 ${cfg.update_channel} · 窗口 ${cfg.window_width}×${cfg.window_height}`
        } catch (e) {
          diag.textContent = '诊断信息不可用：' + String(e)
        }
      })()
    </script>
  </body>
</html>
