# 构建桌面工作站安装包（Tauri 2 薄壳，desktop.md D4）。
# 触发：main 分支 push 且 desktop/ 或本文件变更；也可手动触发。
# Windows 产 NSIS 安装包，Linux 产 deb；产物作为 artifact 供下载。
# 更新发布（nightly Release + latest.json 签名清单）是独立的手动点火 job，不在 push 链上自动发版。
name: Desktop Build

on:
  push:
    branches: [ "main" ]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-nsis
            os: windows-2022
            args: build --bundles nsis
          - name: linux-deb
            os: ubuntu-24.04
            args: build --bundles deb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux build deps (Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf
      - name: Build (${{ matrix.name }})
        run: pnpm tauri ${{ matrix.args }}
        working-directory: desktop
      - name: Upload NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: sinomed-desktop-windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: sinomed-desktop-linux-deb
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
